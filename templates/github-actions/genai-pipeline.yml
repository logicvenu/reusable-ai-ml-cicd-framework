name: GenAI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  prompt-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  security-scan:
    runs-on: ubuntu-latest
    needs: prompt-validation
    steps:
      - uses: actions/checkout@v4

  container-build:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

  deploy:
    runs-on: ubuntu-latest
    needs: container-build
    steps:
      - run: echo "Deploying GenAI service"
